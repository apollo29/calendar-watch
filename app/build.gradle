plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
    id 'androidx.navigation.safeargs.kotlin'
}

base {
    archivesName = "what-calendar"
}

// versionCode = number of git commits (same as the former de.nanogiants.android-versioning plugin)
def gitCommitCount = providers.exec {
    commandLine 'git', 'rev-list', '--count', 'HEAD'
}.standardOutput.asText.get().trim().toInteger()

android {
    namespace = "com.apollo29.calendarwatch"
    compileSdk = 37

    defaultConfig {
        applicationId = "com.apollo29.calendarwatch"
        minSdk = 28
        targetSdk = 37
        versionCode = gitCommitCount
        versionName = "$version"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
}

dependencies {
    // google
    implementation 'com.google.android.material:material:1.14.0'

    // androidx
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.10.2'
    implementation 'androidx.navigation:navigation-ui-ktx:2.10.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.fragment:fragment-ktx:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-reactivestreams-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.transition:transition-ktx:1.7.2'
    implementation 'androidx.work:work-runtime-ktx:2.12.0'

    // hilt
    implementation "com.google.dagger:hilt-android:2.60.1"
    ksp "com.google.dagger:hilt-compiler:2.60.1"

    // ble
    implementation 'no.nordicsemi.android.support.v18:scanner:1.6.0'
    implementation 'no.nordicsemi.android:ble-ktx:2.11.0'
    implementation 'no.nordicsemi.android:ble-common:2.11.0'
    implementation 'no.nordicsemi.android:ble-livedata:2.11.0'

    // other
    implementation 'com.orhanobut:logger:2.2.0'
    implementation 'pub.devrel:easypermissions:3.0.0'
    implementation 'io.github.ShawnLin013:number-picker:2.4.13'
    implementation 'me.relex:circleindicator:2.1.6'
    implementation 'org.apache.commons:commons-lang3:3.21.0'

    // test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
